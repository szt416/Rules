name: "源论坛 YCOO 签到"
description: "ycoo.net 自动签到：23:59 预取 formhash，00:00:00 尝试抢签到排名；失败时自动重新获取 formhash 兜底签到。"
author: "Szt416"
icon: ""

compat_arguments:
  MINUTE: "59"
  HOUR: "23"
  ENABLE_CAPTURE: "false"

compat_arguments_desc: |
  MINUTE=脚本启动分钟（抢排名建议 59）
  HOUR=脚本启动小时（抢排名建议 23）
  ENABLE_CAPTURE=Cookie 捕获（true 开 / false 关）

env_schema:
  ENABLE_CAPTURE:
    name: "Cookie 捕获"
    description: "首次使用时开启，登录 ycoo.net 后访问『源签到』页面；收到成功通知后关闭。"
    default_value: "false"
    options:
      - "false"
      - "true"

mitm:
  hostnames:
    - "ycoo.net"
    - "www.ycoo.net"

scriptings:
  - http_response:
      name: "源论坛 Cookie"
      match: "^https://(?:www\\.)?ycoo\\.net/k_misign-sign\\.html(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/YCOO/YCOO_Signin.js"
      body_required: false
      timeout: 30
      max_size: 1048576
      env:
        ENABLE_CAPTURE: "{{{ENABLE_CAPTURE}}}"

  - schedule:
      name: "源论坛签到"
      cron: "{{{MINUTE}}} {{{HOUR}}} * * *"
      timeout: 120
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/YCOO/YCOO_Signin.js"
      env:
        MODE: "checkin"
