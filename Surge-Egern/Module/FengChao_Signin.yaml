# 蜂巢论坛 — Cookie 捕获 + 定时签到
#
# 使用方法：
# 1. 打开模块设置里的「Cookie 捕获」
# 2. 在经过 Egern 的浏览器里登录 https://fengchao.chat/
# 3. 登录后访问一次首页
# 4. 收到「Cookie 保存成功」通知后，关闭「Cookie 捕获」
# 5. 可在 Egern 脚本页面手动运行「蜂巢签到」测试

name: "蜂巢签到"
description: "fengchao.chat 自动捕获 Cookie 并每日签到"
author: "Szt416"
homepage: "https://github.com/szt416"
icon: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/icons/FengChao.png"
open_url: "https://fengchao.chat/"

compat_arguments:
  MINUTE: "10"
  HOUR: "00"
  ENABLE_CAPTURE: "false"

compat_arguments_desc: |
  MINUTE=签到分钟，默认 10
  HOUR=签到小时，默认 00
  ENABLE_CAPTURE=Cookie 捕获开关，true 开 / false 关

env_schema:
  ENABLE_CAPTURE:
    name: "Cookie 捕获"
    description: "默认关闭；开启后登录 fengchao.chat 并访问首页，保存成功后请关闭"
    default_value: "false"
    options:
      - "false"
      - "true"

mitm:
  hostnames:
    - "fengchao.chat"

scriptings:
  - http_response:
      name: "蜂巢 Cookie"
      match: "^https://fengchao\\.chat/(?:$|\\?|api/check-in\\?)"
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/FengChao/FengChao_Signin.js"
      body_required: false
      timeout: 30
      max_size: 1048576
      env:
        ENABLE_CAPTURE: "{{{ENABLE_CAPTURE}}}"

  - schedule:
      name: "蜂巢签到"
      cron: "{{{MINUTE}}} {{{HOUR}}} * * *"
      timeout: 60
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/FengChao/FengChao_Signin.js"
      env:
        MODE: "checkin"
