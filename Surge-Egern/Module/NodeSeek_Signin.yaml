name: "NodeSeek签到"
description: "NodeSeek 自动签到，支持 Cookie 自动抓取、随机奖励、Cookie 过期提醒及 Telegram 通知。"
author: "Szt416"
homepage: "https://github.com/szt416"
icon: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/icons/NodeSeek.png"

compat_arguments:
  MINUTE: "10"
  HOUR: "0"

compat_arguments_desc: |
  MINUTE=脚本启动分钟
  HOUR=脚本启动小时（每天晚上12点为0）

env_schema:
  ENABLE_CAPTURE:
    name: "Cookie 抓取"
    description: "开启后登录 NodeSeek 并访问个人页面即可自动保存 Cookie，获取成功后建议关闭。"
    default_value: "false"
    options:
      - "true"
      - "false"

  NS_COOKIE:
    name: "NodeSeek Cookie"
    description: "可选。留空时自动使用脚本抓取并保存的 Cookie。"
    default_value: ""

  RANDOM_REWARD:
    name: "签到奖励模式"
    description: "false 为固定奖励，true 为随机奖励。"
    default_value: "true"
    options:
      - "false"
      - "true"

  TG_BOT_TOKEN:
    name: "TG Bot Token"
    description: "可选。填写 Telegram Bot Token，不使用 Telegram 通知可留空。"
    default_value: ""

  TG_USER_ID:
    name: "TG User ID"
    description: "可选。填写 Telegram Chat ID / User ID。"
    default_value: ""

  TG_NOTIFY_ONLY_FAIL:
    name: "TG 仅失败通知"
    description: "开启后签到成功不发送 Telegram，仅失败、风控或异常时通知。"
    default_value: "false"
    options:
      - "true"
      - "false"

scriptings:
  - http_request:
      name: "NodeSeek Cookie 获取"
      match: "^https://www\\.nodeseek\\.com/api/account/getInfo/\\d+\\?readme=1$"
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/NodeSeek/NodeSeek_Cookie.js"
      body_required: false
      timeout: 30

  - schedule:
      name: "NodeSeek 自动签到"
      cron: "{{{MINUTE}}} {{{HOUR}}} * * *"
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/NodeSeek/NodeSeek_Cookie.js"
      timeout: 60

mitm:
  hostnames:
    includes:
      - "www.nodeseek.com"
