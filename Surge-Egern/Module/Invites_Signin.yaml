# 药丸论坛 invites.fun — Cookie 捕获 + 定时签到
# 默认每天 00:10 执行
#
# 使用方法：
# 1. 打开模块中的「Cookie」
# 2. 浏览器登录 https://invites.fun/
# 3. 登录后访问网站首页
# 4. 收到“Cookie 获取成功”通知后关闭「Cookie」
# 5. 可在 Egern 脚本页面手动执行「药丸签到」测试

name: "药丸签到"
description: "invites.fun 每日自动签到"
author: "Szt416"
icon: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/icons/Invites.png"

compat_arguments:
  MINUTE: "10"
  HOUR: "00"
  ENABLE_CAPTURE: "false"

compat_arguments_desc: |
  MINUTE=签到分钟（默认 10）
  HOUR=签到小时（默认 00）
  ENABLE_CAPTURE=Cookie 捕获（true 开 / false 关）

env_schema:
  ENABLE_CAPTURE:
    name: Cookie
    description: 默认关闭；开启后登录 invites.fun 并访问首页保存 Cookie，成功后请关闭
    default_value: "false"
    options:
      - "false"
      - "true"

mitm:
  hostnames:
    - invites.fun

scriptings:
  - http_response:
      name: "药丸 Cookie"
      match: "^https://invites\\.fun/(?:\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/Invites/Invites_Signin.js"
      body_required: false
      timeout: 30
      max_size: 1048576
      env:
        ENABLE_CAPTURE: "{{{ENABLE_CAPTURE}}}"

  - schedule:
      name: "药丸签到"
      cron: "{{{MINUTE}}} {{{HOUR}}} * * *"
      timeout: 60
      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/Invites/Invites_Signin.js"
      env:
        MODE: "checkin"
