name: "HDHive 自动签到"
description: "HDHive 自动签到，支持首次自动获取 Cookie"
author: "Szt416"

icon: "checkmark.circle.fill"


env_schema:

  COOKIE_GET:
    name: "Cookie 获取"
    description: "首次使用开启，登录 HDHive 后访问首页，获取成功后关闭"
    default_value: false
    type: boolean


  SIGN_MODE:
    name: "签到模式"
    description: "选择签到方式"
    default_value: "全部签到"
    options:
      - "普通签到"
      - "赌狗签到"
      - "全部签到"



scriptings:


  - http_request:

      name: "HDHive Cookie获取"

      match: "^https://hdhive\\.com/"

      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/HDHive/HDHive_Cookie.js"

      timeout: 10



  - schedule:

      name: "HDHive签到"

      cron: "0 10 * * *"

      script_url: "https://raw.githubusercontent.com/szt416/Rules/refs/heads/main/Surge-Egern/Scripts/HDHive/HDHive_Signin.js"

      timeout: 30



mitm:

  hostnames:

    - "hdhive.com"
