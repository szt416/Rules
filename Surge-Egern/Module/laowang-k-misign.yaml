name: "老王论坛签到"
description: "老王论坛自动签到，支持 Cookie 配置、签到结果通知及自定义执行时间。"
author: "OpenAI"
homepage: "https://laowang.vip"
icon: "https://laowang.vip/template/laowang/deancss/logo.png"

compat_arguments:
  MINUTE: "10"
  HOUR: "8"
  BASE_URL: "https://laowang.vip"

compat_arguments_desc: |
  MINUTE=脚本启动分钟
  HOUR=脚本启动小时
  BASE_URL=论坛地址，默认 https://laowang.vip

env_schema:
  COOKIE:
    name: "老王论坛 Cookie"
    description: "必填。登录老王论坛后复制完整 Cookie 字符串。"
    default_value: ""

scriptings:
  - schedule:
      name: "老王论坛自动签到"
      cron: "{{{MINUTE}}} {{{HOUR}}} * * *"
      script_url: "./laowang-k-misign.js"
      timeout: 60
      env:
        BASE_URL: "{{{BASE_URL}}}"
